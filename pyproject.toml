[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmind"
version = "0.3.0"
description = "Local-first desktop clipboard manager with semantic search and time-aware queries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyperclip>=1.8,<2",
    # Pinned for torch 2.2.2 (last macOS x86_64 wheel); see requirements.txt.
    "numpy>=1.26,<2",
    "scipy>=1.13,<1.14",
    "transformers==4.48.3",
    "sentence-transformers==3.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Phase 3 adds no runtime dependency (stdlib time parser + SQLite FTS5).
# Later phases: ui = ["PySide6>=6.7", "pynput>=1.7"]

[project.scripts]
clipmind = "clipmind.capture.cli:main"

[tool.setuptools.packages.find]
include = ["clipmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs --runslow; loads the real all-MiniLM-L6-v2 model (may download ~90 MB once)",
]
